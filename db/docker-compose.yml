version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ponycrm-db
    environment:
      POSTGRES_DB: ponycrm
      POSTGRES_USER: pony
      POSTGRES_PASSWORD: pony123
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pony -d ponycrm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: