openapi: 3.0.3
info:
  title: PonyCRM API
  version: 1.0.0
  description: API для управления проектами и требованиями в системе PonyCRM
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки

paths:
  /api/v1/projects:
    get:
      summary: Получить список всех проектов
      operationId: getProjects
      tags:
        - Projects
      responses:
        '200':
          description: Успешный ответ со списком проектов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Создать новый тестовый проект
      operationId: createProject
      tags:
        - Projects
      responses:
        '201':
          description: Проект успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  message:
                    type: string

components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор проекта
        name:
          type: string
          description: Название проекта
        description:
          type: string
          nullable: true
          description: Описание проекта
        status:
          type: string
          enum: [planning, active, archived]
          description: Текущий статус проекта