openapi: 3.0.3
info:
  title: PonyCRM API
  version: 1.3.0
  description: API для управления проектами и участниками в системе PonyCRM
servers:
  - url: http://localhost:8080
    description: Локальный сервер разработки

paths:
  /api/v1/projects:
    get:
      summary: Получить список всех проектов
      operationId: getProjects
      tags:
        - Projects
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Создать новый проект
      operationId: createProject
      tags:
        - Projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpsertRequest'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /api/v1/projects/{projectId}:
    put:
      summary: Обновить проект (название, описание, статус, в том числе архивирование)
      operationId: updateProject
      tags:
        - Projects
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpsertRequest'
      responses:
        '200':
          description: Проект обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Проект не найден

  /api/v1/projects/{projectId}/participants:
    get:
      summary: Получить участников проекта с ролями на проекте
      operationId: getProjectParticipants
      tags:
        - Participants
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список участников проекта
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
        '404':
          description: Проект не найден
    post:
      summary: Добавить участника на проект (новый лид вытесняет старого)
      operationId: addProjectParticipant
      tags:
        - Participants
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantRequest'
      responses:
        '201':
          description: Участник добавлен на проект
        '400':
          description: Недопустимая роль на проекте
        '404':
          description: Проект или пользователь не найден
        '409':
          description: Такая связка уже существует

  /api/v1/users:
    get:
      summary: Получить список всех участников с их ролями
      operationId: getUsers
      tags:
        - Users
      responses:
        '200':
          description: Список участников
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Добавить нового участника (роли только из фиксированного справочника)
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Участник создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации (в том числе недопустимая роль)

  /api/v1/users/{userId}:
    put:
      summary: Обновить участника (ФИО, email, роли заменяются полностью)
      operationId: updateUser
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: Участник обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации (в том числе недопустимая роль)
        '404':
          description: Участник не найден
    delete:
      summary: Удалить участника (каскадно удаляет все его роли и связки с проектами)
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Участник удалён
        '404':
          description: Участник не найден
  /api/v1/projects/{projectId}/requirements:
    get:
      summary: Получить список требований проекта
      operationId: getRequirements
      tags:
        - Requirements
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequirementStatus'
          description: Фильтр по статусу
        - name: priority
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RequirementPriority'
          description: Фильтр по приоритету
      responses:
        '200':
          description: Список требований
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Requirement'
        '404':
          description: Проект не найден
    post:
      summary: Создать новое требование
      operationId: createRequirement
      tags:
        - Requirements
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementUpsertRequest'
      responses:
        '201':
          description: Требование создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requirement'
        '400':
          description: Ошибка валидации
        '404':
          description: Проект или автор не найдены

  /api/v1/projects/{projectId}/requirements/{requirementId}:
    put:
      summary: Обновить требование
      operationId: updateRequirement
      tags:
        - Requirements
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementUpsertRequest'
      responses:
        '200':
          description: Требование обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requirement'
        '400':
          description: Ошибка валидации
        '404':
          description: Требование не найдено
    delete:
      summary: Удалить требование
      operationId: deleteRequirement
      tags:
        - Requirements
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Требование удалено
        '404':
          description: Требование не найдено

  /api/v1/projects/{projectId}/meetings:
    get:
      summary: Получить список конспектов встреч проекта
      operationId: getMeetingNotes
      tags:
        - Meetings
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список конспектов (отсортированы по дате, новые сверху)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingNote'
        '404':
          description: Проект не найден
    post:
      summary: Создать конспект встречи
      operationId: createMeetingNote
      tags:
        - Meetings
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingNoteUpsertRequest'
      responses:
        '201':
          description: Конспект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
        '400':
          description: Ошибка валидации
        '404':
          description: Проект или автор не найдены

  /api/v1/projects/{projectId}/meetings/{meetingId}:
    put:
      summary: Обновить конспект встречи
      operationId: updateMeetingNote
      tags:
        - Meetings
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingNoteUpsertRequest'
      responses:
        '200':
          description: Конспект обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingNote'
        '404':
          description: Конспект не найден
    delete:
      summary: Удалить конспект встречи
      operationId: deleteMeetingNote
      tags:
        - Meetings
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: meetingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Конспект удалён
        '404':
          description: Конспект не найден
components:
  schemas:
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [planning, active, archived]

    ProjectUpsertRequest:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [planning, active, archived]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'

    UserCreateRequest:
      type: object
      required:
        - lastName
        - firstName
        - roles
      properties:
        lastName:
          type: string
        firstName:
          type: string
        middleName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          minItems: 1

    UserRole:
      type: string
      description: Роль участника из фиксированного справочника
      enum:
        - Системный аналитик
        - Бизнес-аналитик
        - Архитектор
        - Дизайнер
        - Бэкенд-разработчик
        - Фронтенд-разработчик
        - QA-инженер
        - Тимлид
        - Юрист

    ProjectRole:
      type: string
      description: Роль участника на конкретном проекте из фиксированного справочника
      enum:
        - Руководитель проекта
        - Системный аналитик
        - Бизнес-аналитик
        - Архитектор
        - Бэкенд-разработчик
        - Фронтенд-разработчик
        - QA-инженер
        - DevOps
        - Дизайнер
        - Технический писатель

    Participant:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        fio:
          type: string
        projectRole:
          $ref: '#/components/schemas/ProjectRole'
        isLead:
          type: boolean

    AddParticipantRequest:
      type: object
      required:
        - userId
        - projectRole
      properties:
        userId:
          type: string
          format: uuid
        projectRole:
          $ref: '#/components/schemas/ProjectRole'
        isLead:
          type: boolean
          default: false

    RequirementStatus:
      type: string
      enum: [ draft, approved, in_dev, done, rejected ]

    RequirementPriority:
      type: string
      enum: [ critical, high, medium, low ]

    Requirement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          $ref: '#/components/schemas/RequirementPriority'
        status:
          $ref: '#/components/schemas/RequirementStatus'
        authorId:
          type: string
          format: uuid
        authorFio:
          type: string
          description: ФИО автора
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RequirementUpsertRequest:
      type: object
      required:
        - title
        - priority
        - status
        - authorId
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        priority:
          $ref: '#/components/schemas/RequirementPriority'
        status:
          $ref: '#/components/schemas/RequirementStatus'
        authorId:
          type: string
          format: uuid

    MeetingNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
          description: Конспект в формате Markdown
        meetingDate:
          type: string
          format: date
        authorId:
          type: string
          format: uuid
        authorFio:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MeetingNoteUpsertRequest:
      type: object
      required:
        - title
        - content
        - meetingDate
        - authorId
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
          description: Конспект в формате Markdown
        meetingDate:
          type: string
          format: date
        authorId:
          type: string
          format: uuid